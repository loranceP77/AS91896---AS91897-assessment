<!DOCTYPE html>
<html lang="en">

<head>
    
    <title>{% block title %}Dream Pizzas{% endblock %}</title>
    
   
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   
    <!-- Links to the external CSS stylesheet using Flask's url_for function -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Preconnect and links for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Actor&family=Doppio+One&family=Petit+Formal+Script&family=Tilt+Neon&display=swap" rel="stylesheet">
</head>

<body>

    <!-- displays alerts/notification messages -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert">
          {% for message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <!-- Navigation bar  -->
    <div class="navigation">
        <a href="{{ url_for('index') }}">Home</a>
        <a href="{{ url_for('menu') }}">Menu</a>
        <a href="{{ url_for('order') }}">Order</a>
        <a href="{{ url_for('display_orders')}}">Order History</a>
    </div>  

    <!-- brand name and contact number -->
    <header>
        <div class="title">Dream Pizzas</div>
        <div class="phone_number">021 000 000</div>
    </header>

   
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Page footer -->
    <footer>
        &copy; Dream Pizzas
    </footer>

</body>
</html>
